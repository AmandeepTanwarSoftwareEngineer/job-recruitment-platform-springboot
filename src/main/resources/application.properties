spring.application.name=jobportal
# ===== Database =====
spring.datasource.url=jdbc:mysql://localhost:3307/job_portal?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== JWT =====
# Key that signs login tokens (HS256). Must be at least 32 bytes; set JWT_SECRET like DB_PASSWORD.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=1h
